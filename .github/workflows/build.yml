name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: payroll-linux
            binary_name: PayrollPro
            ext: ""
          - os: windows-latest
            artifact_name: payroll-windows
            binary_name: PayrollPro
            ext: ".exe"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller certifi rich

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --optimize=1 --name PayrollPro payroll_gui.py

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller payroll_gui.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.binary_name }}${{ matrix.ext }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: payroll-linux
          path: release/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: payroll-windows
          path: release/

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.ref_name }}
          cat > release_notes.md << 'EOF'
          ## Aplikasi Penggajian Karyawan PRO (GUI Desktop)

          ### Fitur
          - 5 tab: Dashboard, Data Karyawan, Hitung Gaji, Laporan, Pengaturan
          - Menu bar (File / Karyawan / Bantuan), database SQLite lokal
          - Gaji mingguan: pokok + lembur + lembur libur, pembulatan menit
          - Export laporan ke CSV

          ### Download
          - **Linux**: `PayrollPro` -- chmod +x -- ./PayrollPro (butuh X server)
          - **Windows**: `PayrollPro.exe` -- double-click, tanpa install Python

          ### Cara Pakai (source)
          python payroll_gui.py   (stdlib only, tanpa install apa pun)
          EOF
          gh release create "$TAG" \
            release/PayrollPro \
            release/PayrollPro.exe \
            --title "$TAG - PayrollPro GUI Windows & Linux" \
            --notes-file release_notes.md