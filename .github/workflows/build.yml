name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: payroll-linux
            binary_name: payroll
            ext: ""
          - os: windows-latest
            artifact_name: payroll-windows
            binary_name: payroll
            ext: ".exe"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller certifi rich

      - name: Locate Python DLL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = python -c "import sys, os; dll=os.path.join(sys.base_exec_prefix, 'python311.dll'); print(dll if os.path.exists(dll) else '')"
          if (-not (Test-Path $dll)) {
            $dll = python -c "import sys, os; dll=os.path.join(sys.exec_prefix, 'python311.dll'); print(dll if os.path.exists(dll) else '')"
          }
          if (-not (Test-Path $dll)) {
            $dll = Get-ChildItem -Path (Split-Path (Get-Command python).Source) -Recurse -Filter "python311.dll" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not (Test-Path $dll)) {
            Write-Error "Python DLL not found"
            exit 1
          }
          Write-Host "Found Python DLL: $dll"
          echo "PYTHON_DLL=$dll" >> $env:GITHUB_ENV

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --strip --optimize=2 --name ${{ matrix.binary_name }} payroll.py

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHON_DLL: ${{ env.PYTHON_DLL }}
        run: |
          if (-not (Test-Path $env:PYTHON_DLL)) {
            Write-Error "Python DLL not found at $env:PYTHON_DLL"
            exit 1
          }
          Write-Host "Bundling Python DLL: $env:PYTHON_DLL"
          pyinstaller --onefile --strip --optimize=2 --name ${{ matrix.binary_name }} --add-binary "$env:PYTHON_DLL;." payroll.py

      - name: Rename for Windows
        if: runner.os == 'Windows'
        run: |
          mv dist/payroll.exe dist/payroll${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.binary_name }}${{ matrix.ext }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: payroll-linux
          path: release/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: payroll-windows
          path: release/

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.ref_name }}
          cat > release_notes.md << 'EOF'
          ## Aplikasi Penggajian Karyawan

          ### Fitur
          - Perhitungan gaji mingguan (pokok + lembur + lembur libur)
          - Pembulatan menit ke atas (default 15 menit)

          ### Download
          - **Linux**: `payroll` -- chmod +x -- ./payroll
          - **Windows**: `payroll.exe` -- double-click jalan

          ### Cara Pakai (source)
          pip install rich pyinstaller
          pyinstaller --onefile --strip --optimize=2 payroll.py

          Final size: Linux 12 MB, Windows 10 MB
          EOF
          gh release create "$TAG" \
            release/payroll \
            release/payroll.exe \
            --title "$TAG - Payroll App Windows & Linux" \
            --notes-file release_notes.md