name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: payroll-linux
            binary_name: payroll
            ext: ""
          - os: windows-latest
            artifact_name: payroll-windows
            binary_name: payroll
            ext: ".exe"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller certifi rich

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --strip --optimize=1 --name ${{ matrix.binary_name }} payroll.py

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller payroll_windows.spec

      - name: Rename for Windows
        if: runner.os == 'Windows'
        run: |
          mv dist/payroll.exe dist/payroll${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.binary_name }}${{ matrix.ext }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: payroll-linux
          path: release/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: payroll-windows
          path: release/

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.ref_name }}
          cat > release_notes.md << 'EOF'
          ## Aplikasi Penggajian Karyawan

          ### Fitur
          - Perhitungan gaji mingguan (pokok + lembur + lembur libur)
          - Pembulatan menit ke atas (default 15 menit)

          ### Download
          - **Linux**: `payroll` -- chmod +x -- ./payroll
          - **Windows**: `payroll.exe` -- double-click jalan

          ### Cara Pakai (source)
          pip install rich pyinstaller
          pyinstaller --onefile --strip --optimize=2 payroll.py

          Final size: Linux 12 MB, Windows 10 MB
          EOF
          gh release create "$TAG" \
            release/payroll \
            release/payroll.exe \
            --title "$TAG - Payroll App Windows & Linux" \
            --notes-file release_notes.md