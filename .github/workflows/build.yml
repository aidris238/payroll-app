name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: payroll-linux
            binary_name: payroll
            ext: ""
          - os: windows-latest
            artifact_name: payroll-windows
            binary_name: payroll
            ext: ".exe"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller certifi rich

      - name: Build executable
        run: |
          pyinstaller --onefile --strip --optimize=2 --name ${{ matrix.binary_name }} payroll.py

      - name: Rename for Windows
        if: runner.os == 'Windows'
        run: |
          mv dist/payroll.exe dist/payroll${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.binary_name }}${{ matrix.ext }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: payroll-linux
          path: release/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: payroll-windows
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/payroll
            release/payroll.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}